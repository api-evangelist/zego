name: Zego
description: >-
  Zego is an FCA-regulated UK insurtech providing flexible, technology-driven
  motor and public-liability insurance built for the gig economy. Its telematics
  app (Sense) rewards safe driving, and it covers food-delivery and courier
  riders, private-hire and taxi drivers, van drivers, fleets, and learner
  drivers with monthly or annual policies. Zego works with partners such as
  Uber, Deliveroo, Just Eat and Amazon Flex, has served around 750,000 drivers
  and sold over 94 million policies. Beyond consumer products, Zego operates a
  RESTful Partner API (developer.zego.com, base URL api.zego.com) that lets work
  providers activate and deactivate insurance cover per shift, register and
  validate customers, enrol customers on public liability, issue fixed-term
  policies, and match external users to Zego customers, with signed webhooks for
  sign-up integration.
