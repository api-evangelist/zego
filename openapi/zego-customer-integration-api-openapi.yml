openapi: 3.2.0
info:
  title: Zego Partner Customer Integration API
  version: '2.0'
  description: The Zego Partner API is a RESTful interface for partners and work providers to interact with Zego on behalf of Zego customers.
  contact:
    name: Zego Partnerships
    url: https://developer.zego.com/
  x-apievangelist-generated: true
  x-source: https://developer.zego.com/
servers:
- url: https://api.zego.com
  description: Production
security:
- partnerToken: []
tags:
- name: Customer Integration
  description: Match external users to Zego customers.
paths:
  /v1/match/:
    post:
      operationId: confirmCustomerMatch
      tags:
      - Customer Integration
      summary: Confirm or report customer matching status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Customer match confirmation payload.
      responses:
        '200':
          description: Match status recorded
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: No match found
components:
  securitySchemes:
    partnerToken:
      type: apiKey
      in: header
      name: Authorization
      description: Partner authorization token issued by the Zego Partnerships Manager, sent in the Authorization header.
