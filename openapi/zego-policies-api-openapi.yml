openapi: 3.2.0
info:
  title: Zego Partner Policies API
  version: '2.0'
  description: The Zego Partner API is a RESTful interface for partners and work providers to interact with Zego on behalf of Zego customers.
  contact:
    name: Zego Partnerships
    url: https://developer.zego.com/
  x-apievangelist-generated: true
  x-source: https://developer.zego.com/
servers:
- url: https://api.zego.com
  description: Production
security:
- partnerToken: []
tags:
- name: Policies
  description: Fixed-term public liability policies.
paths:
  /v2/policy/:
    post:
      operationId: createPolicy
      tags:
      - Policies
      summary: Create a one-day fixed-term public liability policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Policy creation payload.
      responses:
        '201':
          description: Policy created
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
components:
  securitySchemes:
    partnerToken:
      type: apiKey
      in: header
      name: Authorization
      description: Partner authorization token issued by the Zego Partnerships Manager, sent in the Authorization header.
